# J1 - fail2ban protege le service SSH contre le bruteforce.
# Sur Kali les journaux SSH sont dans journald (pas de /var/log/auth.log) :
#   backend = systemd lit directement le journal.
# banaction = nftables : le bannissement passe par nftables, coherent avec le
#   pare-feu J2 ; fail2ban cree sa propre table et ne touche pas a la notre.
[sshd]
enabled   = true
backend   = systemd
banaction = nftables
# MaxAuthTries vaut 3 (S4) : une connexion = au plus 3 echecs d'affilee.
# maxretry = 4 : on tolere une connexion ratee (faute de frappe) mais on bannit
#   des qu'un attaquant insiste sur une deuxieme connexion.
maxretry  = 4
# findtime : fenetre pendant laquelle on compte les echecs.
findtime  = 10m
# bantime : volontairement court pour ne pas rester bloque pendant la demo.
#   Debannir a la main : fail2ban-client set sshd unbanip <ip>
bantime   = 15m
