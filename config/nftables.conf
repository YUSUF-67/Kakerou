#!/usr/sbin/nft -f

# J2 - pare-feu nftables.
# Politique par defaut en entree : DROP (tout ce qui entre est refuse), sauf :
#   - le loopback (lo), indispensable au fonctionnement local ;
#   - les connexions deja etablies ou liees (ct state established,related) ;
#   - SSH (22/tcp), seul service expose.
#
# IMPORTANT : on ne fait PAS 'flush ruleset'. Cela effacerait la table de
# fail2ban (inet f2b-table) et donc tous les bannissements en cours. On ne
# (re)cree que notre propre table 'inet filtre', ce qui rend un rechargement
# (systemctl reload nftables) sans danger pour les bans de fail2ban (J1).

# Idempotence : on declare la table (creee si absente) puis on la supprime,
# ainsi le 'delete' ne provoque jamais d'erreur, et on la recree proprement.
table inet filtre
delete table inet filtre

table inet filtre {
    chain entree {
        type filter hook input priority 0; policy drop;

        iif "lo" accept                          # trafic local (boucle)
        ct state established,related accept       # reponses aux connexions sortantes
        ct state invalid drop                     # paquets incoherents : jetes

        tcp dport 22 accept                       # SSH : seul service accessible

        ip protocol icmp accept                   # ping IPv4 (diagnostic)
        ip6 nexthdr ipv6-icmp accept              # ping/voisinage IPv6
    }

    chain transfert {
        type filter hook forward priority 0; policy drop;   # pas de routage
    }

    chain sortie {
        type filter hook output priority 0; policy accept;  # sorties autorisees
    }
}
